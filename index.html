<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TGS Recrutement">
<meta name="theme-color" content="#0f3b5f">
<meta name="format-detection" content="telephone=no">
<title>TGS CI – Test de recrutement · Accueil & Relation client</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--ink:#16202c;--muted:#5d6875;--line:#dde1e6;
  --brand:#0f3b5f;--brand-2:#1f6aa5;--accent:#c9a45c;--ok:#1f7a4d;--warn:#b7791f;--bad:#b42318;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:24px 18px 60px}
header.top{background:var(--brand);color:#fff}
header.top .wrap{padding:16px 18px;display:flex;align-items:center;gap:14px}
.logo{width:42px;height:42px;border-radius:10px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800;letter-spacing:-.5px;user-select:none;cursor:default}
.brand-t{font-weight:700;font-size:17px;line-height:1.2}
.brand-s{font-size:13px;opacity:.8}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:999px;font-size:14px;display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:18px}
h1{font-size:26px;line-height:1.25;margin:0 0 8px}
h2{font-size:20px;margin:0 0 6px}
h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=number],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand-2);outline-offset:1px;border-color:transparent}
textarea{min-height:130px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:#0b2e4a}
.btn.ghost{background:#fff;color:var(--brand)}
.btn.ghost:hover{background:#eef3f8}
.btn.danger{background:#fff;color:var(--bad);border-color:#f0c3bf}
.btn.sm{padding:6px 12px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.progress{height:6px;background:#e5e8ec;border-radius:999px;overflow:hidden;margin:6px 0 18px}
.progress>div{height:100%;background:var(--brand-2);transition:width .3s}
.q{padding:18px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.qn{font-size:13px;color:var(--muted);font-weight:600}
.qt{font-weight:600;margin:2px 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;background:#fff}
.opt:hover{border-color:#b9c4cf}
.opt input{margin-top:4px;accent-color:var(--brand)}
.opt.sel{border-color:var(--brand-2);background:#f0f6fc}
.missing{outline:2px solid #f3b5ae;border-radius:8px}
.note{background:#f7f3ea;border:1px solid #eadfc4;border-radius:8px;padding:12px 14px;font-size:14px}
ul.rules{padding-left:18px;margin:8px 0}
ul.rules li{margin:4px 0}
footer.foot{text-align:center;font-size:12px;color:#9aa3ad;padding:20px}
/* admin */
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.b-ok{background:#e3f4ea;color:var(--ok)}.b-warn{background:#fdf1dc;color:var(--warn)}.b-bad{background:#fde7e5;color:var(--bad)}.b-na{background:#eceff2;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:#f6f8fa}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.total{font-size:40px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.ans{font-size:14px;margin:4px 0;padding:6px 10px;border-radius:6px;border:1px solid var(--line)}
.ans.chosen{border-color:var(--brand-2);background:#f0f6fc;font-weight:600}
.pts{float:right;font-weight:700;font-variant-numeric:tabular-nums;margin-left:10px}
.p-good{color:var(--ok)}.p-mid{color:var(--warn)}.p-zero{color:var(--bad)}
.openans{white-space:pre-wrap;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.guide{font-size:13px;color:var(--muted);margin:6px 0}
.scorepick{display:flex;gap:6px;flex-wrap:wrap}
.scorepick button{min-width:38px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-weight:600}
.scorepick button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.crit{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.alert{border-left:4px solid var(--bad);background:#fdf3f2;padding:8px 12px;border-radius:6px;font-size:14px;margin:6px 0}

ol.steps{margin:8px 0 4px;padding-left:0;list-style:none;counter-reset:st}
ol.steps li{counter-increment:st;position:relative;padding:6px 0 6px 40px;border-bottom:1px dashed #eadfc4}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(st);position:absolute;left:0;top:6px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.kbd{display:inline-block;padding:1px 8px;border:1px solid #c9ced6;border-bottom-width:2px;border-radius:6px;background:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.fiche{border:2px solid var(--brand);border-radius:12px;padding:18px}
.fiche dl{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;margin:0}
.fiche dt{color:var(--muted);font-size:14px}.fiche dd{margin:0;font-weight:600}
mark.err{background:#fde2df;border-bottom:2px solid var(--bad);padding:0 1px;border-radius:2px}
mark.warn{background:#fdf0d5;border-bottom:2px solid var(--warn);padding:0 1px;border-radius:2px}
.errlist{font-size:13px;margin:6px 0 0;padding-left:18px}.errlist li{margin:2px 0}
.chk{font-size:13px;margin:2px 0}.chk.ok{color:var(--ok)}.chk.no{color:var(--bad)}
.tl{font-size:13px;border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.tl div{margin:3px 0}
.synth li{margin:3px 0}
.autotag{font-size:11px;font-weight:700;color:var(--brand-2);background:#e8f1fa;border-radius:999px;padding:2px 8px;margin-left:6px}
.stat{display:inline-block;margin-right:14px;font-size:13px;color:var(--muted)}.stat b{color:var(--ink)}
input[type=datetime-local]{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px}

/* identification + photo */
.idgrid{display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:start;margin-top:10px}
@media(max-width:620px){.idgrid{grid-template-columns:1fr}}
.photoBox{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.photoPrev{aspect-ratio:3/4;border:2px dashed #b9c4cf;border-radius:12px;display:grid;place-items:center;overflow:hidden;background:#f7f9fb;color:var(--muted);font-size:14px;text-align:center;padding:6px}
.photoPrev img{width:100%;height:100%;object-fit:cover}
.photoBox .btn{justify-content:center}
.ficheGrid{display:grid;grid-template-columns:140px 1fr;gap:18px;align-items:start}
.ficheImg{width:140px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
@media(max-width:560px){.ficheGrid{grid-template-columns:1fr}}
.okline{display:flex;gap:12px;align-items:center;margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fafbfc;font-size:15px}
.okline input{width:26px;height:26px;accent-color:var(--brand);flex:none}
.idpics{display:flex;gap:10px;margin-right:6px}
.idpics figure{margin:0;text-align:center}
.idpics img{width:110px;height:146px;object-fit:cover;border:1px solid var(--line);border-radius:8px;background:#f2f4f6;display:block}
.idpics #dCv{object-fit:contain;object-position:top;cursor:pointer}
.idpics figcaption{font-size:11px;color:var(--muted);margin-top:3px;max-width:110px}
.cvthumb{width:46px;height:62px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:4px;background:#f2f4f6}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tscroll input[type=text]{padding:6px 8px;font-size:14px}
.tscroll select{padding:6px 8px;font-size:14px;min-width:170px}
/* tablette */
html{-webkit-text-size-adjust:100%}
button,.btn,.opt,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (pointer:coarse){
  input[type=text],input[type=tel],input[type=email],input[type=password],textarea,select{font-size:17px;padding:13px 14px}
  .btn{padding:14px 24px;font-size:17px;min-height:50px}
  .btn.sm{padding:10px 14px;font-size:15px;min-height:42px}
  .opt{padding:15px 16px;font-size:17px;margin-bottom:10px;border-radius:10px}
  .opt input{width:22px;height:22px;margin-top:2px;flex:none}
  .qt{font-size:18px}
  textarea{min-height:180px}
  .scorepick button{min-width:46px;min-height:44px}
  .logo{width:48px;height:48px}
}
.print-only{display:none}
.hidden{display:none!important}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;font-size:12px}
  header.top,footer.foot,.no-print,.btn{display:none!important}
  .print-only{display:block}
  .wrap{max-width:none;padding:0}
  .card{border:1px solid #ccc;padding:14px;margin-bottom:10px}
  .crit,.kpis{break-inside:avoid}
  h2,h3{break-after:avoid}
  .scorepick:not(:has(.on))::after{content:"____ (à noter)";color:#666}
  .autotag{border:1px solid #9bb}
  .tl{columns:2;font-size:11px}
  .q{break-inside:avoid}
  .idpics img{width:90px;height:120px}
  .kpi{padding:8px}
  .scorepick button{display:none}
  .scorepick button.on{display:inline-block;background:#fff;color:#000;border:1px solid #000}
  .total{font-size:30px}
  .ans{padding:3px 8px}
  .ans:not(.chosen):not(.best){display:none}
  .ans.best:not(.chosen)::before{content:"Meilleure réponse : ";font-weight:700;color:#1f7a4d}
  .q{padding:8px 0}
}
</style>
</head>

function findCV(nom,prenom,tel){
  const cvs=load(K_CV,[]),p=normPhone(tel),tn=nameTokens(nom).filter(t=>t.length>=2),tp=nameTokens(prenom).filter(t=>t.length>=2);
  let best=null,bs=0;
  cvs.forEach(cv=>{
    const nt=nameTokens(cv.nom),txt=" "+nameTokens((cv.text||"").slice(0,4000)).join(" ")+" ";
    const inName=t=>nt.includes(t),inTxt=t=>txt.includes(" "+t+" ");
    const mn=tn.filter(t=>inName(t)||inTxt(t)).length,mp=tp.filter(t=>inName(t)||inTxt(t)).length;
    const mName=tn.concat(tp).filter(inName).length;
    const ph=p.length>=8&&(cv.tels||[]).some(t=>normPhone(t)===p);
    let sc=(ph?10:0)+mName*3+mn+mp;
    const ok=ph||(mn>=1&&mp>=1);
    if(ok&&sc>bs){bs=sc;best=cv}
  });
  return best;
}

const goAway=()=>{if(cur&&!isAdmin&&!ignoreBlur&&!awayStart&&cur.startedAt&&!cur.endedAt){awayStart=Date.now()}};
const comeBack=()=>{if(cur&&awayStart){const ms=Date.now()-awayStart;if(ms>800){cur.away.push({t:awayStart,ms,step:cur.step+1});logEv(`Sortie de la page pendant ${fmtDur(ms)} (partie ${cur.step+1})`)}awayStart=null;save(K_CUR,cur)}};

    if(!st.first){st.first=now;st.think=now-lastAnsAt;lastAnsAt=now}else st.changes++;

    app.querySelectorAll(`input[name="${qid}"]`).forEach(x=>x.closest(".opt").classList.toggle("sel",x.checked));

    const qid=t.dataset.q,st=()=>cur.qstat[qid]=cur.qstat[qid]||{focusMs:0,keys:0,dels:0,paste:0};
    let fStart=null;
    const wc=()=>{app.querySelector(`[data-wc="${qid}"]`).textContent=words(t.value)+" mot(s)"};

    t.onblur=()=>{if(fStart){st().focusMs+=Date.now()-fStart;fStart=null;save(K_CUR,cur)}};
    t.onkeydown=e=>{const s=st();s.keys++;if(e.key==="Backspace"||e.key==="Delete")s.dels++;if(!s.firstKey)s.firstKey=Date.now();s.lastKey=Date.now()};
    t.oninput=()=>{cur.answers[qid]=t.value;wc();save(K_CUR,cur)};
    t.oncut=t.oncopy=e=>e.preventDefault();

  $("#next").onclick=()=>{

    else{

/* ================== ANALYSE DE LA LANGUE ================== */
const LOCAL_RULES=[
  {re:/\b(bjr|bsr|slt|stp|svp|pk|pq|pcq|tkt|mdr|jsp|cc|dac|dak|tt|ts|pr|ds|bcp|mtn|jr|dj|tjrs|qlq|qq|vs|pd|jpp|kdo|ptn|stv|psk)\b/gi,cat:"Langage SMS / abréviation",w:1},
  {re:/\bc\b(?!')/gi,cat:"Langage SMS / abréviation",w:1,msg:"« c » au lieu de « c'est »"},
  {re:/\b(tu|te|toi|ton|ta|tes)\b/gi,cat:"Tutoiement",w:1,msg:"Le vouvoiement est attendu avec un client"},
  {re:/\b(ok|okay|ouais|gars|truc|bah|ben|genre|grave|boss|tonton|tantie|mon frère|ma sœur|ma soeur|chéri|chérie)\b/gi,cat:"Registre familier",w:0.5},
  {re:/[!?]{2,}/g,cat:"Ponctuation excessive",w:0.5},
  {re:/\b(c'est|j'ai|y a|il y a|on a|je sais|je peux|il faut|ça marche|je suis) pas\b/gi,cat:"Négation incomplète (« ne » manquant)",w:0.5},
  {re:/\b(vais|va|allons|allez|vont|pouvez|peux|peut|pouvons|dois|doit|devez|veux|voulez|voudrais|faut)\s+(vous\s+|le\s+|la\s+|les\s+|lui\s+|nous\s+)?([a-zà-ÿ]+(ez|é|és|ée|ées))\b/gi,cat:"Grammaire (infinitif attendu : -er)",w:1},
  {re:/\b(malgré que|au jour d'aujourd'hui|se poste|sa va|ça va aller vite)\b/gi,cat:"Faute courante",w:1},
  {re:/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,cat:"Émoji",w:0.25},
  {re:/\b[A-ZÀ-Ý]{4,}(\s+[A-ZÀ-Ý]{2,}){2,}\b/g,cat:"Texte en majuscules",w:0.5}
];
function localCheck(text){
  const out=[];
  LOCAL_RULES.forEach(r=>{r.re.lastIndex=0;let m;while((m=r.re.exec(text))){out.push({o:m.index,l:m[0].length,cat:r.cat,w:r.w,msg:r.msg||r.cat,rep:"",src:"local"});if(!r.re.global)break}});
  // majuscule en début de phrase
  const re=/(^|[.!?]\s+)([a-zà-ÿ])/g;let m;while((m=re.exec(text))){const o=m.index+m[1].length;out.push({o,l:1,cat:"Majuscule manquante",w:0.5,msg:"Majuscule attendue en début de phrase",rep:m[2].toUpperCase(),src:"local"})}
  const tr=text.trim();if(tr&&!/[.!?…»)]$/.test(tr))out.push({o:text.length-1,l:1,cat:"Ponctuation finale manquante",w:0.25,msg:"La dernière phrase ne se termine pas par un point",rep:"",src:"local"});
  return out;
}
const LT_IGNORE=/WHITESPACE|ESPACE|APOS|NBSP|TIRET|GUILLEMET|TYPOGRAPH|UPPERCASE_SENTENCE_START|DOUBLE_PUNCTUATION/i;
function ltCat(m){const c=(m.rule&&m.rule.category&&m.rule.category.id)||"";const id=(m.rule&&m.rule.id)||"";
  if(c==="TYPOS"||/SPELL|HUNSPELL|MORFOLOGIK/.test(id))return["Orthographe",1];
  if(/GRAMMAR|AGREEMENT|ACCORD|CONJUG|VERB/.test(c+id))return["Grammaire / accord",1];
  if(/PUNCT|VIRG/.test(c+id))return["Ponctuation",0.5];
  if(/CASING/.test(c))return["Majuscule",0.5];
  if(/STYLE|REDUND|REPETITION|PLAIN/.test(c))return["Style",0.25];
  if(/CONFUSED|HOMOPHON/.test(c+id))return["Confusion de mots",1];
  return["Grammaire / accord",1]}
async function ltCheck(text){
  const body=new URLSearchParams({text,language:"fr",level:"default"});
  const r=await fetch("https://api.languagetool.org/v2/check",{method:"POST",body});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();
  return j.matches.filter(m=>!LT_IGNORE.test(((m.rule&&m.rule.id)||"")+" "+((m.rule&&m.rule.category&&m.rule.category.id)||""))).map(m=>{const [cat,w]=ltCat(m);return{o:m.offset,l:m.length,cat,w,msg:m.message,rep:(m.replacements||[]).slice(0,3).map(x=>x.value).join(" / "),src:"lt"}});
}
async function analyze(id){
  const get=()=>load(K_LIST,[]).find(x=>x.id===id);let c=get();if(!c)return;
  const lang={};let online=true;
  for(const q of openQ(c)){
    const t=c.answers[q.id]||"";let lt=null;
    if(t.trim()){try{lt=await ltCheck(t)}catch(e){online=false}}
    const loc=localCheck(t);
    // fusion : on retire les doublons locaux qui chevauchent une erreur LanguageTool
    const merged=(lt||[]).concat(loc.filter(a=>!(lt||[]).some(b=>a.o<b.o+b.l&&b.o<a.o+a.l)));
    merged.sort((a,b)=>a.o-b.o);
    lang[q.id]={m:merged,online:!!lt};
    await new Promise(r=>setTimeout(r,600));
  }
  const L=load(K_LIST,[]);const i=L.findIndex(x=>x.id===id);if(i<0)return;
  L[i].lang=lang;L[i].langAt=Date.now();L[i].langOnline=online;save(K_LIST,L);
  return L[i];
}

/* ================== ÉVALUATION AUTOMATIQUE ================== */
function langStats(c){
  let wds=0,wsum=0,cats={},n=0;
  openQ(c).forEach(q=>{const t=c.answers[q.id]||"";wds+=words(t);const ms=(c.lang&&c.lang[q.id]?c.lang[q.id].m:localCheck(t));ms.forEach(m=>{wsum+=m.w;n++;cats[m.cat]=(cats[m.cat]||0)+1})});
  const dens=wds?wsum/wds*100:0;
  const note=Math.max(0,Math.min(10,10-dens*0.8));
  return{wds,n,wsum,cats,dens,note};
}
function answerLang(c,q){const t=c.answers[q.id]||"";const ms=(c.lang&&c.lang[q.id]?c.lang[q.id].m:localCheck(t));const w=words(t);const ws=ms.reduce((a,m)=>a+m.w,0);return{ms,w,dens:w?ws/w*100:0}}
function autoOpen(c,q){
  const t=c.answers[q.id]||"",n=deacc(t),w=words(t),kw=new RegExp(BANK.kw,"gi");
  const ideas=new Set((n.match(kw)||[]).map(x=>x.toLowerCase()));
  const crit=q.crit.map(k=>{
    let ok=false,det="";
    if(k.w){ok=w>=k.w;det=w+" mots"}
    else if(k.k){ok=ideas.size>=k.k;det=ideas.size+" idée(s) repérée(s)"}
    else ok=k.r.every(p=>new RegExp(p,"i").test(n));
    return{l:k.l,ok,det};
  });
  const L=answerLang(c,q);
  const langOk=L.dens<2?1:L.dens<5?0.5:0;
  crit.push({l:"Qualité de la langue",ok:langOk===1,half:langOk===0.5,det:`${L.ms.length} faute(s) · ${L.dens.toFixed(1)} pour 100 mots`});
  let sc=crit.reduce((a,x)=>a+(x.ok?1:x.half?0.5:0),0);
  const pen=[];
  if((q.id==="G2"||q.id==="G3"||q.id==="HCAI5")&&L.ms.some(m=>m.cat==="Tutoiement")){sc-=1;pen.push("Tutoiement du client : −1")}
  if((q.id==="G3")&&L.ms.some(m=>m.cat==="Langage SMS / abréviation")){sc-=1;pen.push("Abréviations SMS : −1")}
  if(w<15){sc=Math.min(sc,1);pen.push("Réponse trop courte (moins de 15 mots) : note plafonnée à 1")}

function autoPonct(c){
  if(!c.info.rdv)return null;const late=(c.arrivalAt-new Date(c.info.rdv).getTime())/60000;
  return{late,score:late<=0?4:late<=10?3:late<=20?2:late<=30?1:0};
}
function autoProf(c){
  const cv=load(K_CV,[]).find(x=>x.id===c.cvId);if(!cv||!cv.text||cv.text.length<40)return{};
  const sc=cv.scores||{},n=(sc.ACC||0)+(sc.CAI||0),d=deacc(cv.text);
  const exp=n>=5?4:n>=3?3:n>=1?2:/stage|experience/.test(d)?1:0;
  const sup=/master|licence|\bbts\b|\bdut\b|\bdts\b|bac\s*\+\s*[2-5]/.test(d),rel=/assistan|communication|commerc|gestion|marketing|hotel|tourisme|secretar|ressources humaines|relation|accueil|vente/.test(d);
  const form=sup?(rel?3:2):/\bbac|baccalaur|bepc|\bcap\b/.test(d)?1:0;
  return{exp,form};

function qPoints(q,a){
  if(q.type==="single")return a===undefined?0:q.opts[a].p;
  if(q.type==="multi"){const s=(a||[]).reduce((t,i)=>t+q.opts[i].p,0);return Math.max(0,Math.min(q.max,s))}
  return null;
}
function compute(c){
  const bySec={};let qcm=0,qcmMax=0;
  const OQ=openQ(c);secsOf(c).forEach(s=>{if(s.id==="G"||s.questions.every(q=>q.type==="open"))return;let p=0,m=0;s.questions.forEach(q=>{if(q.type==="open")return;p+=qPoints(q,c.answers[q.id]);m+=q.max});bySec[s.id]={id:s.id,title:s.title,p,m,pct:m?p/m*100:0};qcm+=p;qcmMax+=m});
  const op=c.admin.open||{},pr=c.admin.pres||{},pf=c.admin.profil||{};
  const auto={};OQ.forEach(q=>auto[q.id]=autoOpen(c,q));
  const openVal=q=>op[q.id]!==undefined?op[q.id]:auto[q.id].score;
  const ap=autoPonct(c);
  const presVal=k=>pr[k]!==undefined?pr[k]:(k==="ponct"&&ap?ap.score:undefined);
  const apf=autoProf(c),profVal=k=>pf[k]!==undefined?pf[k]:apf[k];
  const presDone=PRES_CRIT.every(([k])=>presVal(k)!==undefined),profDone=PROF_CRIT.every(([k])=>profVal(k)!==undefined);
  const openP=OQ.reduce((t,q)=>t+openVal(q),0),openM=OQ.length*5;
  const presP=PRES_CRIT.reduce((t,[k])=>t+(presVal(k)||0),0),presM=PRES_CRIT.length*4;
  const profP=PROF_CRIT.reduce((t,[k])=>t+(profVal(k)||0),0),profM=PROF_CRIT.reduce((t,x)=>t+x[2],0);
  const s={qcm:qcm/qcmMax*W.qcm,open:openP/openM*W.open,pres:presP/presM*W.pres,profil:profP/profM*W.profil};
  const total=s.qcm+s.open+s.pres+s.profil;
  const complete=presDone&&profDone;
  const durMs=c.endedAt?c.endedAt-c.startedAt:null;
  const awayMs=(c.away||[]).reduce((a,x)=>a+x.ms,0);
  const lang=langStats(c);
  const alerts=[];
  if(bySec.D&&bySec.D.pct<50)alerts.push("Français (QCM) insuffisant : moins de 50 % à la partie français.");
  if(lang.dens>=6)alerts.push(`Nombreuses fautes à l'écrit : ${lang.dens.toFixed(1)} fautes pour 100 mots.`);
  if(presDone&&s.pres<10)alerts.push("Présentation jugée insuffisante (moins de 10/20).");
  if(bySec.A&&bySec.A.pct<50)alerts.push("Accueil physique faible (moins de 50 %).");
  if((c.away||[]).length>=2||awayMs>60000)alerts.push(`Sorties de la page : ${(c.away||[]).length} fois, ${fmtDur(awayMs)} au total. Risque d'aide extérieure.`);
  if(c.paste)alerts.push(`${c.paste} tentative(s) de copier-coller bloquée(s).`);
  if(durMs!=null&&durMs>(DUREE_MIN+10)*60000)alerts.push(`Durée : ${fmtDur(durMs)}, au-delà du temps conseillé (${DUREE_MIN} min).`);
  secsOf(c).forEach(sec=>{if(sec.id==="G")return;const t=c.sec&&c.sec[sec.id];if(t&&t.ms/sec.questions.length<5000)alerts.push(`Partie « ${sec.title} » faite très vite (${fmtDur(t.ms)} pour ${sec.questions.length} questions) : réponses peut-être au hasard.`)});
  if(!c.cvId)alerts.push("Aucun CV correspondant retrouvé : vérifiez l'identité avec la photo.");
  if(ap&&ap.late>10)alerts.push(`Arrivée en retard de ${Math.round(ap.late)} min par rapport à la convocation.`);
  let dec,cls;
  const blocking=alerts.some(a=>a.startsWith("Français")||a.startsWith("Présentation")||a.startsWith("Nombreuses fautes"));
  if(c.admin.decision){dec=c.admin.decision;cls=dec==="Retenue"?"b-ok":dec==="Non retenue"?"b-bad":"b-warn"}
  else if(!complete){dec="Évaluation à compléter";cls="b-na"}
  else if(total>=SEUIL_RETENUE&&!blocking){dec="Retenue";cls="b-ok"}
  else if(total>=SEUIL_REVOIR){dec="À revoir (2e entretien)";cls="b-warn"}
  else{dec="Non retenue";cls="b-bad"}
  return{bySec,qcm,qcmMax,openP,openM,presP,presM,profP,profM,s,total,complete,presDone,profDone,alerts,dec,cls,durMs,awayMs,lang,auto,openVal,presVal,ap,apf};
}
function synthese(c,r){
  const forts=[],faibles=[];
  Object.values(r.bySec).forEach(x=>{if(x.id==="F")return;if(x.pct>=75)forts.push(`${x.title} : ${Math.round(x.pct)} %`);else if(x.pct<50)faibles.push(`${x.title} : ${Math.round(x.pct)} %`)});
  const L=r.lang;
  if(L.dens<2)forts.push(`Très bonne qualité d'écriture (${L.n} faute(s) pour ${L.wds} mots)`);
  else if(L.dens>=5)faibles.push(`Écriture fautive : ${L.n} fautes pour ${L.wds} mots (${L.dens.toFixed(1)} / 100 mots)`);
  const topCats=Object.entries(L.cats).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${k} (${v})`);
  if(topCats.length&&L.dens>=2)faibles.push("Fautes les plus fréquentes : "+topCats.join(", "));
  openQ(c).forEach(q=>{const a=r.auto[q.id];if(a.score>=4)forts.push(`Bonne réponse rédigée : « ${q.q.slice(0,60)}… » (${a.score}/5)`);else if(a.score<=2)faibles.push(`Réponse rédigée faible : « ${q.q.slice(0,60)}… » (${a.score}/5)`)});
  if(r.durMs!=null){const m=r.durMs/60000;if(m<15)faibles.push(`Test terminé très vite (${fmtDur(r.durMs)}) : manque d'application possible`);else if(m<=DUREE_MIN)forts.push(`Temps bien géré : ${fmtDur(r.durMs)} pour ${DUREE_MIN} min conseillées`)}
  if(!(c.away||[]).length&&!c.paste)forts.push("Aucune sortie de la page ni tentative de copier-coller");
  const ch=Object.values(c.qstat||{}).reduce((a,x)=>a+(x.changes||0),0);if(ch>=6)faibles.push(`Beaucoup d'hésitations : ${ch} changements de réponse au QCM`);
  const reco=r.dec==="Retenue"?"Profil adapté au poste d'accueil : candidature à retenir, sous réserve de l'entretien oral.":r.dec.startsWith("À revoir")?"Profil intéressant mais avec des points à vérifier : prévoir un 2e entretien ou une mise en situation (appel client simulé).":r.dec==="Non retenue"?"Le niveau actuel ne correspond pas aux exigences du service client de TGS CI.":"Complétez la présentation et le profil CV pour obtenir la recommandation finale.";
  return{forts,faibles,reco};
}

async function pdfLib(){await loadScript(PDFJS);window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_W;return window.pdfjsLib}
async function ocrCanvas(canvas,onP){await loadScript(TESS);const r=await Tesseract.recognize(canvas,"fra",{logger:m=>{if(m.status==="recognizing text"&&onP)onP(Math.round(m.progress*100))}});return r.data.text||""}
function canvasFromDataURL(u){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,2000/Math.max(i.width,i.height));const c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c)};i.onerror=rej;i.src=u})}
const fileToDataURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
async function readCV(file,onP){
  let text="",thumb=null,ocr=false;
  if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){
    const lib=await pdfLib();const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    let first=null;
    for(let p=1;p<=Math.min(pdf.numPages,3);p++){const pg=await pdf.getPage(p);const tc=await pg.getTextContent();let last=null;
      tc.items.forEach(it=>{const y=Math.round(it.transform[5]);if(last!==null&&Math.abs(y-last)>3)text+="\n";else if(last!==null)text+=" ";text+=it.str;last=y});text+="\n";
      if(p===1){const vp=pg.getViewport({scale:2});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;first=c}}
    const t=document.createElement("canvas");const k=360/first.width;t.width=360;t.height=first.height*k;t.getContext("2d").drawImage(first,0,0,t.width,t.height);thumb=t.toDataURL("image/jpeg",0.75);
    if(text.replace(/\s/g,"").length<60){onP&&onP("reconnaissance du texte (CV scanné)…");text=await ocrCanvas(first,x=>onP&&onP("reconnaissance du texte "+x+" %"));ocr=true}
  }else{
    const u=await fileToDataURL(file);const c=await canvasFromDataURL(u);
    const t=document.createElement("canvas");const k=360/c.width;t.width=360;t.height=c.height*k;t.getContext("2d").drawImage(c,0,0,t.width,t.height);thumb=t.toDataURL("image/jpeg",0.75);
    onP&&onP("reconnaissance du texte…");text=await ocrCanvas(c,x=>onP&&onP("reconnaissance du texte "+x+" %"));ocr=true;
  }
  return{text,thumb,ocr};
}
const NAME_STOP=/curriculum|vitae|\bcv\b|profil|contact|experience|formation|competence|adresse|telephone|e-?mail|objectif|langue|loisir|diplome|assistante?|secretaire|stage|licence|master|informati|reference|centre|interet|personnel|parcours|nationalite|cote d.ivoire|abidjan|situation|etat civil|date|ne le|nee le|agent|charge|gestion|caissiere|hotesse|commerciale|developpe|technicien|a propos|about|resume|qualit|atout|skills/;
function parseCV(text,fileName){
  const lines=text.split(/\n/).map(l=>l.replace(/\s+/g," ").trim()).filter(Boolean);
  let nom="";
  for(const l of lines.slice(0,25)){const d=deacc(l);if(NAME_STOP.test(d))continue;if(!/^[A-Za-zÀ-ÿ'’\- ]{5,45}$/.test(l))continue;const w=l.split(" ").filter(x=>x.length>1);if(w.length<2||w.length>5)continue;
    if(w.some(x=>x===x.toUpperCase()&&x.length>1)||w.every(x=>/^[A-ZÀ-Ý]/.test(x))){nom=l;break}}
  if(!nom){nom=fileName.replace(/\.[a-z]+$/i,"").replace(/[_\-]+/g," ").replace(/\b(cv|CV|Cv|new|final|pdf|de|du|mon|professionnel|francais|simple|bleu|\d+)\b/g," ").replace(/\s+/g," ").trim()}
  const tels=[...new Set((text.match(/(?:\+?\s?225[\s.\-]?)?\(?0\d\)?(?:[\s.\-]?\d{2}){4}/g)||[]).map(x=>normPhone(x)).filter(x=>x.length===10))];
  const email=(text.match(/[\w.+-]+@[\w-]+\.[\w.]+/)||[""])[0];
  const d=deacc(text);
  const dip=((text.match(/\b(BTS|Licence|LICENCE|Master|MASTER|DUT|BAC\s?\+?\s?\d?|Baccalaur[ée]at|BEPC|CAP|BT|Doctorat|DTS|HND)\b[^\n]{0,70}/)||[""])[0]).replace(/\s+/g," ").replace(/[|,;\s]+$/,"").trim();
  const sc={};const mk=new Set();
  Object.entries(PROF_RX).forEach(([k,re])=>{const m=d.match(re)||[];sc[k]=m.length;m.slice(0,6).forEach(x=>mk.add(x))});
  const years=(d.match(/\b(19|20)\d{2}\s*(-|–|a|au)\s*((19|20)\d{2}|aujourd|ce jour|present|nos jours)/g)||[]).length;
  let best=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];
  let profil=best&&best[1]>=2?best[0]:"JUN";
  if(profil==="ACC"&&sc.ACC<3&&years<1)profil="JUN";
  return{nom,tels,email,diplome:dip,profil,profilAuto:profil,scores:sc,motsCles:[...mk].slice(0,12)};
}
async function importCVs(files,onP){
  const C=load(K_CV,[]);let i=0,errs=[];
  for(const f of files){i++;const tag=`CV ${i}/${files.length} (${f.name}) : `;
    try{onP(tag+"lecture…");const r=await readCV(f,x=>onP(tag+x));const info=parseCV(r.text,f.name);
      const id="V"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      await idb.put({id:"F_"+id,data:await fileToDataURL(f),type:f.type||"application/pdf",name:f.name});
      await idb.put({id:"T_"+id,data:r.thumb});
      const old=C.findIndex(x=>x.file===f.name);const rec={id,file:f.name,text:r.text.slice(0,12000),ocr:r.ocr,addedAt:Date.now(),rdv:"",...info};
      if(old>=0){rec.rdv=C[old].rdv;C[old]=rec}else C.push(rec);save(K_CV,C);
    }catch(e){errs.push(f.name+" : "+e.message)}}
  onP(`${files.length-errs.length} CV importé(s).`+(errs.length?" Erreurs : "+errs.join(" ; ")+" (une connexion Internet est nécessaire pour lire les CV).":""));
}
async function openCV(id){try{const f=await idb.get("F_"+id);if(!f){alert("Fichier introuvable.");return}const b=await (await fetch(f.data)).blob();const u=URL.createObjectURL(b);const w=window.open(u,"_blank");if(!w)location.href=u}catch(e){alert("Impossible d'ouvrir le CV.")}}

  </div>`;

  cvs.forEach(x=>idb.get("T_"+x.id).then(t=>{const im=app.querySelector(`[data-thumb="${x.id}"]`);if(im&&t)im.src=t.data}).catch(()=>{}));
  app.querySelectorAll("[data-cvf]").forEach(inp=>inp.onchange=()=>{const C=load(K_CV,[]);const x=C.find(y=>y.id===inp.dataset.id);const f=inp.dataset.cvf;
    x[f]=f==="tels"?inp.value.split(",").map(s=>s.trim()).filter(Boolean):inp.value;save(K_CV,C);
    if(f==="rdv"){const L=load(K_LIST,[]);L.forEach(c=>{if(c.cvId===x.id)c.info.rdv=inp.value});save(K_LIST,L)}});
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openCV(b.dataset.open));
  app.querySelectorAll("[data-delcv]").forEach(b=>b.onclick=()=>{if(confirm("Retirer ce CV de la tablette ?")){const id=b.dataset.delcv;save(K_CV,load(K_CV,[]).filter(y=>y.id!==id));idb.del("F_"+id).catch(()=>{});idb.del("T_"+id).catch(()=>{});renderList()}});
  $("#cvUp").onchange=async e=>{const files=[...e.target.files];if(!files.length)return;$("#cvUp").disabled=true;await importCVs(files,t=>{cvMsg=t;const p=$("#cvProg");if(p)p.textContent=t});renderList()};
  $("#printList").onclick=()=>window.print();
  $("#logout").onclick=home;
  $("#newTest").onclick=()=>{if(cur&&!confirm("Un entretien est en cours. L'abandonner ?"))return;localStorage.removeItem(K_CUR);cur=null;isAdmin=false;renderWelcome()};
  $("#exp").onclick=()=>{const b=new Blob([JSON.stringify({resultats:load(K_LIST,[]),cv:load(K_CV,[])},null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="TGS-CI-recrutement-"+new Date().toISOString().slice(0,10)+".json";a.click()};
  $("#imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);const inc=Array.isArray(j)?j:j.resultats||[];const list=load(K_LIST,[]);inc.forEach(c=>{const i=list.findIndex(x=>x.id===c.id);if(i<0)list.push(c);else list[i]=c});save(K_LIST,list);
    if(j.cv){const R=load(K_CV,[]);j.cv.forEach(x=>{if(!R.some(y=>y.id===x.id))R.push(x)});save(K_CV,R)}alert(inc.length+" dossier(s) importé(s).");renderList()}catch(err){alert("Fichier invalide.")}})};
  $("#chpw").onclick=()=>{const o=prompt("Mot de passe actuel :");if(o===null)return;if(hash(o)!==pwdHash()){alert("Mot de passe actuel incorrect.");return}const n=prompt("Nouveau mot de passe (4 caractères minimum) :");if(!n||n.length<4){alert("Mot de passe trop court.");return}localStorage.setItem(K_PWD,hash(n));alert("Mot de passe modifié.")};
}

function ptsCls(p,m){return p>=m?"p-good":p>0?"p-mid":"p-zero"}
function picker(group,key,max,val,auto){let h=`<div class="scorepick" data-g="${group}" data-k="${key}">`;for(let i=0;i<=max;i++)h+=`<button type="button" data-v="${i}" class="${(val===i)||(val===undefined&&auto===i)?"on":""}">${i}</button>`;return h+(val===undefined&&auto!==undefined?`<span class="autotag">note automatique</span>`:"")+`</div>`}
function highlight(t,ms){let out="",pos=0;ms.filter(m=>m.o>=pos||true).sort((a,b)=>a.o-b.o).forEach(m=>{if(m.o<pos)return;out+=esc(t.slice(pos,m.o));out+=`<mark class="${m.w>=1?"err":"warn"}" title="${esc(m.msg)}">${esc(t.slice(m.o,m.o+m.l))||"&nbsp;"}</mark>`;pos=m.o+m.l});return out+esc(t.slice(pos))}

function renderDetail(id){
  const list=load(K_LIST,[]);const c=list.find(x=>x.id===id);if(!c)return renderList();
  const r=compute(c),syn=synthese(c,r),L=r.lang;
  const persist=()=>{const LL=load(K_LIST,[]);const i=LL.findIndex(x=>x.id===id);LL[i]=c;save(K_LIST,LL)};
  const cv=load(K_CV,[]).find(x=>x.id===c.cvId);const SS=secsOf(c),OQ=openQ(c);
  const secRows=SS.map((s,i)=>{const t=(c.sec||{})[s.id]||{ms:0,visits:0};const exp=SEC_MIN[s.id]*60000;const per=t.ms/s.questions.length;
    let rem=t.ms>exp*1.5?"Lent":t.ms<exp*0.25?"Très rapide":"Normal";const col=rem==="Normal"?"var(--ok)":rem==="Lent"?"var(--warn)":"var(--bad)";
    return `<tr><td>${i+1}. ${esc(s.title)}</td><td class="num">${fmtDur(t.ms)}</td><td class="num">${SEC_MIN[s.id]} min</td><td class="num">${fmtDur(per)}</td><td class="num">${t.visits}</td><td style="color:${col};font-weight:600">${rem}</td></tr>`}).join("");
  const catsHTML=Object.entries(L.cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`).join("")||`<tr><td colspan="2" class="muted">Aucune faute détectée</td></tr>`;
  let h=`
  <div class="row no-print" style="margin-bottom:12px"><button class="btn ghost sm" id="back">← Retour au tableau de bord</button><span class="spacer"></span>
    <button class="btn ghost sm" id="reana">Relancer l'analyse des fautes</button><button class="btn danger sm" id="del">Supprimer</button><button class="btn sm" id="print">Imprimer la fiche</button></div>
  <div class="print-only" style="margin-bottom:8px"><b>TGS CI Réparation</b> · Fiche d'entretien – Chargée d'accueil & relation client · Imprimée le ${fmtDate(Date.now())}</div>

  <div class="card">
    <div class="row" style="align-items:flex-start">
      <div class="idpics"><figure><img id="dPhoto" alt="Photo prise le jour de l'entretien"><figcaption>Photo prise à l'entretien</figcaption></figure><figure><img id="dCv" alt="CV"><figcaption>${cv?`<a href="#" id="openCv">CV reçu (ouvrir)</a>`:"Aucun CV retrouvé"}</figcaption></figure></div>
      <div><div class="small muted">Dossier ${esc(c.id.toUpperCase())} · questionnaire « ${esc(PROFILS[c.profil||"JUN"])} »${cv?"":" · CV non retrouvé"}</div><h1 style="margin-bottom:2px">${esc(c.info.nom)}</h1>
      <div class="small muted">${esc([c.info.tel,c.info.email,c.info.lieu].filter(Boolean).join(" · ")||"Aucun contact saisi")}${c.info.diplome?"<br>Diplôme déclaré : "+esc(c.info.diplome):""}${c.info.salaire?"<br>Prétentions : "+esc(c.info.salaire)+" FCFA":""}${cv&&cv.nom&&deacc(cv.nom)!==deacc(c.info.nom)?`<br>Nom sur le CV : « ${esc(cv.nom)} »`:""}</div></div>
      <span class="spacer"></span>
      <div style="text-align:right"><div class="total">${r.total.toFixed(1)}<span style="font-size:18px;color:var(--muted)">/100</span></div><span class="badge ${r.cls}">${esc(r.dec)}</span></div>
    </div>
    <div class="kpis" style="margin-top:16px">
      <div class="kpi"><div class="v">${r.s.qcm.toFixed(1)}</div><div class="l">QCM /${W.qcm} (${r.qcm}/${r.qcmMax} pts)</div></div>
      <div class="kpi"><div class="v">${r.s.open.toFixed(1)}</div><div class="l">Rédigé /${W.open} (${r.openP}/${r.openM})</div></div>
      <div class="kpi"><div class="v">${r.presDone?r.s.pres.toFixed(1):"—"}</div><div class="l">Présentation /${W.pres}${r.presDone?"":" · à noter"}</div></div>
      <div class="kpi"><div class="v">${r.profDone?r.s.profil.toFixed(1):"—"}</div><div class="l">Profil/CV /${W.profil}${r.profDone?"":" · à noter"}</div></div>
      <div class="kpi"><div class="v">${L.note.toFixed(1)}</div><div class="l">Qualité de la langue /10</div></div>
    </div>
    <table style="margin-top:16px"><thead><tr><th>Compétence (QCM)</th><th class="num">Points</th><th class="num">Réussite</th></tr></thead><tbody>
    ${Object.values(r.bySec).map(x=>`<tr><td>${esc(x.title)}</td><td class="num">${x.p} / ${x.m}</td><td class="num" style="color:${x.pct>=70?"var(--ok)":x.pct>=50?"var(--warn)":"var(--bad)"}">${Math.round(x.pct)} %</td></tr>`).join("")}
    </tbody></table>
    ${r.alerts.map(a=>`<div class="alert">${esc(a)}</div>`).join("")}
  </div>

  <div class="card"><h2>Synthèse automatique</h2>
    <div class="grid2"><div><h3 style="color:var(--ok)">Points forts</h3><ul class="synth">${syn.forts.map(x=>`<li>${esc(x)}</li>`).join("")||"<li class='muted'>—</li>"}</ul></div>
    <div><h3 style="color:var(--bad)">Points de vigilance</h3><ul class="synth">${syn.faibles.map(x=>`<li>${esc(x)}</li>`).join("")||"<li class='muted'>—</li>"}</ul></div></div>
    <div class="note" style="margin-top:8px"><b>Recommandation :</b> ${esc(syn.reco)}</div>
  </div>

  <div class="card"><h2>Temps et comportement</h2>
    <div><span class="stat">Arrivée <b>${fmtHour(c.arrivalAt)}</b></span><span class="stat">Convocation <b>${c.info.rdv?fmtDate(new Date(c.info.rdv)):"non renseignée"}</b></span>${r.ap?`<span class="stat">Écart <b>${r.ap.late<=0?"à l'heure ("+Math.round(-r.ap.late)+" min d'avance)":Math.round(r.ap.late)+" min de retard"}</b></span>`:""}</div>
    <div><span class="stat">Début <b>${fmtHour(c.startedAt)}</b></span><span class="stat">Fin <b>${fmtHour(c.endedAt)}</b></span><span class="stat">Durée totale <b>${fmtDur(r.durMs)}</b> / ${DUREE_MIN} min</span><span class="stat">Lecture de la fiche <b>${fmtDur(c.ficheMs)}</b></span></div>
    <div><span class="stat">Sorties de page <b>${(c.away||[]).length}</b> (${fmtDur(r.awayMs)})</span><span class="stat">Copier-coller bloqués <b>${c.paste||0}</b></span><span class="stat">Changements de réponse <b>${Object.values(c.qstat||{}).reduce((a,x)=>a+(x.changes||0),0)}</b></span></div>
    <table style="margin-top:12px"><thead><tr><th>Partie</th><th class="num">Temps passé</th><th class="num">Conseillé</th><th class="num">Moy./question</th><th class="num">Passages</th><th>Rythme</th></tr></thead><tbody>${secRows}</tbody></table>
    <h3 style="margin-top:14px">Chronologie</h3>
    <div class="tl">${(c.log||[]).map(e=>`<div><b>${fmtHour(e.t)}</b> — ${esc(e.e)}</div>`).join("")}</div>
  </div>

  <div class="card"><h2>Qualité de la langue écrite</h2>
    <div><span class="stat">Mots écrits <b>${L.wds}</b></span><span class="stat">Fautes relevées <b>${L.n}</b></span><span class="stat">Densité <b>${L.dens.toFixed(1)} / 100 mots</b></span><span class="stat">Note <b>${L.note.toFixed(1)}/10</b></span></div>
    <p class="small muted">${c.lang?(c.langOnline?"Analyse faite avec le correcteur LanguageTool (en ligne) et les règles internes TGS CI (abréviations SMS, tutoiement, registre familier…).":"Correcteur en ligne indisponible au moment de l'analyse : seules les règles internes ont été appliquées. Cliquez sur « Relancer l'analyse des fautes » une fois connecté à Internet."):"Analyse en cours ou non effectuée : cliquez sur « Relancer l'analyse des fautes »."}</p>
    <table style="max-width:420px"><thead><tr><th>Type de faute</th><th class="num">Nombre</th></tr></thead><tbody>${catsHTML}</tbody></table>
  </div>

  <div class="card"><h2>Présentation à l'entretien <span class="muted small">(observée par vous, 0 à 4)</span></h2>
    <p class="small muted no-print">0 = inacceptable · 1 = faible · 2 = moyen · 3 = bien · 4 = excellent. La ponctualité est notée automatiquement si l'heure de convocation est renseignée.</p>
    ${PRES_CRIT.map(([k,l])=>`<div class="crit"><div>${l}</div>${picker("pres",k,4,c.admin.pres[k],k==="ponct"&&r.ap?r.ap.score:undefined)}</div>`).join("")}
  </div>
  <div class="card"><h2>Adéquation du profil / CV</h2>
    ${cv?`<p class="small"><b>CV retrouvé :</b> ${esc(cv.file)} · nom lu : ${esc(cv.nom||"—")}${cv.diplome?`<br><b>Diplôme repéré :</b> ${esc(cv.diplome)}`:""}${cv.motsCles&&cv.motsCles.length?`<br><b>Mots-clés du CV :</b> ${esc(cv.motsCles.join(", "))}`:""}</p>`:`<p class="small" style="color:var(--warn)">Aucun CV correspondant n'a été retrouvé sur la tablette.</p>`}
    ${PROF_CRIT.map(([k,l,m])=>`<div class="crit"><div>${l} <span class="muted small">(0 à ${m})</span></div>${picker("profil",k,m,c.admin.profil[k],r.apf[k])}</div>`).join("")}
  </div>

  <div class="card"><h2>Réponses rédigées</h2>
    <p class="small muted no-print">Les fautes sont surlignées (rouge = faute, orange = maladresse). Passez la souris dessus pour voir l'explication. La note automatique peut être modifiée d'un clic.</p>
    ${OQ.map((q,qi)=>{const t=c.answers[q.id]||"";const A=r.auto[q.id];const La=answerLang(c,q);const st=(c.qstat||{})[q.id]||{};
      return `<div class="q"><div class="qt">${qi+1}. ${esc(q.q)}</div>
      <div class="openans">${t?highlight(t,La.ms):"<i>Pas de réponse</i>"}</div>
      <div style="margin-top:4px"><span class="stat">Mots <b>${La.w}</b></span><span class="stat">Fautes <b>${La.ms.length}</b></span><span class="stat">Temps de rédaction <b>${fmtDur(st.focusMs)}</b></span><span class="stat">Frappes <b>${st.keys||0}</b></span><span class="stat">Corrections (effacements) <b>${st.dels||0}</b></span>${st.paste?`<span class="stat" style="color:var(--bad)">Copier-coller bloqués <b>${st.paste}</b></span>`:""}</div>
      ${La.ms.length?`<ul class="errlist">${La.ms.map(m=>`<li><b>« ${esc(t.slice(m.o,m.o+m.l))} »</b> — ${esc(m.cat)} : ${esc(m.msg)}${m.rep?` → <i style="font-style:normal;color:var(--ok)">${esc(m.rep)}</i>`:""}</li>`).join("")}</ul>`:""}
      <div style="margin-top:8px">${A.crit.map(k=>`<div class="chk ${k.ok?"ok":k.half?"":"no"}">${k.ok?"✔":k.half?"◐":"✘"} ${esc(k.l)}${k.det?` <span class="muted">(${esc(k.det)})</span>`:""}</div>`).join("")}${A.pen.map(p=>`<div class="chk no">− ${esc(p)}</div>`).join("")}</div>
      <div class="guide"><b>Attendus :</b> ${esc(q.guide)}</div>
      <div class="row"><span class="small"><b>Note :</b></span>${picker("open",q.id,5,c.admin.open[q.id],A.score)}</div></div>`}).join("")}
  </div>

  <div class="card"><h2>Détail des réponses au QCM</h2>
    ${SS.filter(s=>s.id!=="G").map(s=>`<h3 style="margin-top:16px">${esc(s.title)}</h3>`+s.questions.filter(q=>q.type!=="open").map(q=>{
      const a=c.answers[q.id],p=qPoints(q,a),st=(c.qstat||{})[q.id]||{};const mx=Math.max(...q.opts.map(x=>x.p));
      const chosen=i=>q.type==="multi"?(a||[]).includes(i):a===i;
      const hist=q.type==="single"&&st.hist&&st.hist.length>1?` · parcours : ${st.hist.map(i=>"« "+q.opts[i].t.slice(0,25)+"… »").join(" → ")}`:"";
      return `<div class="q"><div class="qt">${esc(q.q)} <span class="pts ${ptsCls(p,q.max)}">${p} / ${q.max}</span></div>
      <div class="small muted" style="margin-bottom:4px">Temps de réflexion ≈ ${fmtDur(st.think)} · changements : ${st.changes||0}${esc(hist)}</div>
      ${q.opts.map((o,i)=>`<div class="ans ${chosen(i)?"chosen":""} ${o.p===mx?"best":""}"><span class="pts ${o.p>0?"p-good":"p-zero"}" style="font-weight:600">${o.p>0?"+":""}${o.p}</span>${chosen(i)?"✔ ":""}${esc(o.t)}</div>`).join("")}</div>`}).join("")).join("")}
  </div>

  <div class="card"><h2>Observations et décision finale</h2>
    <label class="f" for="notes">Observations de l'entretien</label>
    <textarea id="notes" placeholder="Points forts, points faibles, disponibilité, remarques…">${esc(c.admin.notes||"")}</textarea>
    <div class="row" style="margin-top:12px"><label class="f" for="dec" style="margin:0">Décision</label>
      <select id="dec" style="max-width:280px"><option value="">Automatique (selon les points)</option>
      ${["Retenue","À revoir (2e entretien)","Non retenue"].map(d=>`<option ${c.admin.decision===d?"selected":""}>${d}</option>`).join("")}</select></div>
    <div class="print-only" style="margin-top:30px"><div class="row"><div>Fait à Abidjan, le ____________________</div><span class="spacer"></span><div>Signature de la direction : ____________________</div></div></div>
  </div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  (c.photoInline?Promise.resolve({data:c.photoInline}):idb.get("P_"+c.id)).then(p=>{const im=$("#dPhoto");if(im&&p)im.src=p.data}).catch(()=>{});
  if(cv){idb.get("T_"+cv.id).then(t=>{const im=$("#dCv");if(im&&t)im.src=t.data}).catch(()=>{});$("#openCv").onclick=e=>{e.preventDefault();openCV(cv.id)};$("#dCv").onclick=()=>openCV(cv.id)}
  const rerender=()=>{const y=window.scrollY;renderDetail(id);window.scrollTo(0,y)};
  $("#back").onclick=renderList;$("#print").onclick=()=>window.print();
  $("#reana").onclick=async()=>{$("#reana").textContent="Analyse en cours…";$("#reana").disabled=true;await analyze(id);rerender()};
  $("#del").onclick=()=>{if(confirm("Supprimer définitivement ce dossier ?")){save(K_LIST,load(K_LIST,[]).filter(x=>x.id!==id));idb.del("P_"+id).catch(()=>{});renderList()}};
  app.querySelectorAll(".scorepick button").forEach(b=>b.onclick=()=>{const w=b.parentElement;const g=w.dataset.g,k=w.dataset.k,v=+b.dataset.v;
    c.admin[g]=c.admin[g]||{};if(c.admin[g][k]===v)delete c.admin[g][k];else c.admin[g][k]=v;persist();rerender()});
  $("#notes").oninput=e=>{c.admin.notes=e.target.value;persist()};
  $("#dec").onchange=e=>{c.admin.decision=e.target.value;persist();rerender()};
  if(!c.lang){analyze(id).then(x=>{if(x&&isAdmin&&document.querySelector("#reana"))rerender()})}
}

/* ================== ACCÈS DISCRET ADMIN ================== */
$("#logo").addEventListener("dblclick",openAdmin);
let taps=[];$("#logo").addEventListener("touchend",e=>{const t=Date.now();taps=taps.filter(x=>t-x<2500);taps.push(t);if(taps.length>=5){taps=[];e.preventDefault();openAdmin()}});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.shiftKey&&(e.key==="A"||e.key==="a")){e.preventDefault();openAdmin()}});
if(location.hash==="#admin"){history.replaceState(null,"",location.pathname);openAdmin()}else home();

</script>
</body>
</html>
